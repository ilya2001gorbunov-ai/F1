name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare project
        run: |
          Z=$(ls *.zip 2>/dev/null | head -1)
          if [ -n "$Z" ]; then mkdir -p _src && unzip -oq "$Z" -d _src; fi
          for f in $(find . -name settings.gradle.kts -not -path './.git/*'); do
            d=$(dirname "$f")
            if [ -f "$d/app/build.gradle.kts" ]; then echo "PROJ=$d" >> $GITHUB_ENV; found=1; break; fi
          done
          if [ -z "$found" ]; then echo "Не найден app/build.gradle.kts. Файлы:"; find . -not -path './.git/*' | head -80; exit 1; fi

      - name: Download circuit maps
        working-directory: ${{ env.PROJ }}
        run: |
          mkdir -p app/src/main/assets
          curl -fsSL --retry 3 -o app/src/main/assets/f1-circuits.geojson \
            https://raw.githubusercontent.com/bacinger/f1-circuits/master/f1-circuits.geojson

      - name: Build debug APK
        working-directory: ${{ env.PROJ }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        working-directory: ${{ env.PROJ }}
        run: cp app/build/outputs/apk/debug/app-debug.apk F1-Calendar.apk

      - uses: actions/upload-artifact@v4
        with:
          name: F1-Calendar-apk
          path: ${{ env.PROJ }}/F1-Calendar.apk
