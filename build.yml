name: Build APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Контуры трасс F1 (GeoJSON, MIT) — для карты трассы в приложении и виджете
      - name: Download circuit maps
        run: |
          mkdir -p app/src/main/assets
          curl -fsSL --retry 3 -o app/src/main/assets/f1-circuits.geojson \
            https://raw.githubusercontent.com/bacinger/f1-circuits/master/f1-circuits.geojson
          ls -l app/src/main/assets

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk F1-Calendar.apk

      - uses: actions/upload-artifact@v4
        with:
          name: F1-Calendar-apk
          path: F1-Calendar.apk

      - name: Publish release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: F1-Calendar.apk
